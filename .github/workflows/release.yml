name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches ecko.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version ecko.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match ecko.json version $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
